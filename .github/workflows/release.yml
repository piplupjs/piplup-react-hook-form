name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
      tests:
        description: Run tests before publishing
        type: boolean
        default: true
      changelog:
        description: Update CHANGELOG.md
        type: boolean
        default: true
      dry-run:
        description: Dry run (build and version, but do not publish or push)
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the release commit and tag, create the GitHub release
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog needs the previous tag

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@latest

      - name: Install Playwright browsers
        if: inputs.tests
        run: npx playwright install --with-deps chromium

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release
        run: >
          npm run release --
          --bump ${{ inputs.bump }}
          ${{ inputs.tests && '--tests' || '--no-tests' }}
          ${{ inputs.changelog && '--changelog' || '--no-changelog' }}
          ${{ inputs.dry-run && '--dry-run' || '--push' }}

      - name: Create GitHub release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./packages/rhf-core/package.json').version")"
          gh release create "$tag" --title "$tag" --generate-notes --verify-tag
